# A Kubernetes manifest root (`kind: kubernetes-manifests` in .cbx-guard.yml). The review diffs it
# against the PR base without Terraform (MCL-38).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27.2
          ports:
            - containerPort: 8080
